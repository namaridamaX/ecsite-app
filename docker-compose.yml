services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecsite
      POSTGRES_PASSWORD: ecsite_local_password
      POSTGRES_DB: ecsite
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecsite']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ecsite:ecsite_local_password@db:5432/ecsite
      LOG_LEVEL: debug
      CORS_ORIGIN: '*'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
