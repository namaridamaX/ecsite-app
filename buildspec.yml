version: 0.2

# CodeBuildプロジェクトの環境変数で以下を設定する想定:
#   AWS_ACCOUNT_ID     : AWSアカウントID
#   AWS_DEFAULT_REGION : ap-northeast-1
#   IMAGE_REPO_NAME    : ecsite-dev-ecr-web
#   CONTAINER_NAME     : web (タスク定義のコンテナ名と一致させる)
#
# ECSネイティブBlue/Greenデプロイでは、Blue/Greenの制御自体はECSサービス側の設定
# (deploymentStrategy)に組み込まれているため、CodeBuild/CodePipeline側は
# 「イメージをビルドしてECRにpushし、新しいイメージURIを伝える」だけで完結する。
# CodeDeploy用のtaskdef.json / appspec.yamlは不要。

phases:
  pre_build:
    commands:
      - echo ECRへログインします
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      # コミットハッシュの先頭7文字をイメージタグに使い、どのコミットのビルドか追跡できるようにする
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo Dockerイメージをビルドします
      - docker build -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo ECRへpushします
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo CodePipelineのECS標準デプロイアクション用にimagedefinitions.jsonを生成します
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

# CodePipelineの「Deploy(Amazon ECS標準デプロイアクション)」ステージが
# このファイル名を直接参照する(デフォルト名: imagedefinitions.json)。
artifacts:
  files:
    - imagedefinitions.json
